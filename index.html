  <!-- Значок вкладки. Используем тот же файл, что и для аватара. -->

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #030303; color: #fafafa; font: 100%/1.4 Inter, Arial, sans-serif; }
    main { width: min(86%, 1360px); margin: auto; padding: clamp(44px, 6vw, 96px) 0; }
    header { position: relative; isolation: isolate; display: flex; align-items: center; gap: clamp(24px, 2.8vw, 46px); }
    .grid { position: absolute; z-index: -1; right: -7vw; top: -15%; width: 68%; height: 160%; overflow: hidden; perspective: 180px; pointer-events: none; mask-image: radial-gradient(ellipse, #000 6%, transparent 73%); }
    .grid::before { content: ""; position: absolute; inset: -110% -20% -20%; background-image: linear-gradient(#494949 1px, transparent 1px), linear-gradient(90deg, #494949 1px, transparent 1px); background-size: 84px 48px; transform: rotateX(64deg); }
    .avatar { display: block; width: clamp(130px, 16.6vw, 256px); aspect-ratio: 1; object-fit: cover; border-radius: 50%; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(42px, 5.55vw, 86px); line-height: 1.08; font-weight: 550; letter-spacing: -.045em; }
    header p { margin-top: 12px; color: #e8e8e8; font-size: clamp(18px, 2.05vw, 32px); }
    nav { display: flex; gap: clamp(18px, 3vw, 46px); margin-top: 26px; }
    a { color: inherit; text-decoration: none; }
    nav a { display: grid; place-items: center; width: 46px; height: 46px; }
    nav svg { width: 85%; height: 85%; fill: currentColor; }
    a:focus-visible { outline: 2px solid #ff99be; outline-offset: 4px; }
    nav a:hover { color: #ff99be; }
    section { margin-top: clamp(70px, 7.5vw, 116px); }
    h2 { font-size: clamp(36px, 3.85vw, 60px); letter-spacing: -.04em; font-weight: 550; margin: 0 12px 12px; }
    .project { display: grid; grid-template-columns: 1fr 15% 20% auto; gap: 2%; align-items: center; padding: clamp(18px, 1.7vw, 28px) 12px; font-size: clamp(16px, 1.65vw, 26px); }
    .project + .project { border-top: 1px solid #48484c; }
    .project:hover { background: #111; }
    .project h3 { font-size: clamp(24px, 2.55vw, 40px); letter-spacing: -.03em; font-weight: 600; }
    .project p, .project span { color: #d5d5d5; }
    .project b { font-size: 1.4em; font-weight: 400; }

    @media (max-width: 680px) {
      main { width: 88%; }
      header { flex-direction: column; align-items: flex-start; }
      .grid { width: 90%; height: 85%; right: -6vw; }
      nav { margin-top: 18px; }
      h2 { margin-left: 0; }
      .project { grid-template-columns: auto 1fr auto; gap: 8px 12px; padding: 20px 0; }
      .project div { grid-column: 1 / 3; }
      .project span { grid-row: 2; font-size: 14px; }
      .project b { grid-column: 3; grid-row: 1 / 3; }
    }
  </style>
</head>
<body>

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="1" y="1" width="22" height="22" rx="2"/>
              <g fill="#030303">

                <path d="M5 10h3v9H5zm5 0h3v1.3c1.8-2.6 7-2.3 7 2.5V19h-3v-4.6c0-2.7-4-2.9-4 .2V19h-3z"/>

  <script>
    const avatar = document.getElementById("avatar");
    const favicon = document.getElementById("favicon");

    function setRoundFavicon() {
      if (!avatar.naturalWidth) return;

      const size = 64;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const context = canvas.getContext("2d");
      if (!context) return;

      // Берём квадрат из центра изображения, как у аватара на странице.
      const cropSize = Math.min(avatar.naturalWidth, avatar.naturalHeight);
      const cropX = (avatar.naturalWidth - cropSize) / 2;
      const cropY = (avatar.naturalHeight - cropSize) / 2;

      context.beginPath();
      context.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      context.clip();
      context.drawImage(avatar, cropX, cropY, cropSize, cropSize, 0, 0, size, size);

      const roundIcon = favicon.cloneNode();
      roundIcon.type = "image/png";
      roundIcon.sizes = "64x64";
      roundIcon.href = canvas.toDataURL("image/png");
      favicon.replaceWith(roundIcon);
    }

    if (avatar.complete) {
      setRoundFavicon();
    } else {
      avatar.addEventListener("load", setRoundFavicon, { once: true });
    }
  </script>
</body>
</html>
